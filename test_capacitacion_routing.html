<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test - Routing Capacitación</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    .info { color: blue; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Test de Routing de Capacitación</h1>
  
  <h2>1. Test de API - Temas</h2>
  <button onclick="testTemas()">Probar GET /api/capacitacion/temas</button>
  <div id="resultTemas"></div>
  
  <h2>2. Test de API - Bloques</h2>
  <button onclick="testBloques()">Probar GET /api/capacitacion/bloques</button>
  <div id="resultBloques"></div>
  
  <h2>3. Test de Charset UTF-8</h2>
  <div id="charsetTest"></div>
  
  <script>
    const BASE_URL = 'http://localhost:8000';
    
    async function testTemas() {
      const result = document.getElementById('resultTemas');
      result.innerHTML = '<p class="info">Cargando...</p>';
      
      try {
        const response = await fetch(`${BASE_URL}/api/capacitacion/temas`);
        const data = await response.json();
        
        if (data.ok && data.temas && data.temas.length > 0) {
          result.innerHTML = `
            <p class="success">✅ OK - ${data.temas.length} temas cargados</p>
            <pre>${JSON.stringify(data.temas[0], null, 2)}</pre>
          `;
          
          // Test charset
          const charsetDiv = document.getElementById('charsetTest');
          const primer_tema = data.temas[0].nombre;
          const tiene_acentos = /[áéíóúñÁÉÍÓÚÑ]/.test(primer_tema);
          
          charsetDiv.innerHTML = tiene_acentos 
            ? `<p class="success">✅ UTF-8 correcto: "${primer_tema}"</p>`
            : `<p class="info">ℹ️ No se encontraron acentos en el primer tema: "${primer_tema}"</p>`;
        } else {
          result.innerHTML = `<p class="error">❌ Error: ${JSON.stringify(data)}</p>`;
        }
      } catch (err) {
        result.innerHTML = `<p class="error">❌ Error de red: ${err.message}</p>`;
      }
    }
    
    async function testBloques() {
      const result = document.getElementById('resultBloques');
      result.innerHTML = '<p class="info">Cargando...</p>';
      
      try {
        const response = await fetch(`${BASE_URL}/api/capacitacion/bloques`);
        const data = await response.json();
        
        if (data.ok && data.bloques && data.bloques.length > 0) {
          result.innerHTML = `
            <p class="success">✅ OK - ${data.bloques.length} bloques cargados</p>
            <pre>${JSON.stringify(data.bloques[0], null, 2)}</pre>
          `;
        } else {
          result.innerHTML = `<p class="error">❌ Error: ${JSON.stringify(data)}</p>`;
        }
      } catch (err) {
        result.innerHTML = `<p class="error">❌ Error de red: ${err.message}</p>`;
      }
    }
    
    // Auto-test al cargar
    window.addEventListener('load', () => {
      testTemas();
    });
  </script>
</body>
</html>
