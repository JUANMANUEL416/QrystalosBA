<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qrystalos — Guía de Procesos y Capacitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/libro.css?v=44">
</head>
<body>
  <header class="top">
    <!-- Izquierda: Marca e Identidad Corporativa -->
    <div class="top-izq">
      <a class="marca" href="/libro/" title="Ir a la portada de inicio">
        <div class="marca-iso-wrap">
          <svg class="qrys-logo-iso" viewBox="0 0 100 100" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="12" y="12" width="60" height="60" rx="14" stroke="#1565C0" stroke-width="12" stroke-linejoin="round"/>
            <path d="M72 48 H84 V62 H98 V74 H84 V88 H72 V74 H58 V62 H72 V48 Z" fill="#F97316"/>
          </svg>
        </div>
        <div class="marca-textos">
          <span class="marca-kicker">IX Colombia · Qrystalos</span>
          <strong>Guía de Procesos</strong>
        </div>
      </a>
      <span class="top-nota-badge" id="topNota" title="Estado de la guía">Manual de uso y capacitación</span>
    </div>

    <!-- Centro: Botón Menú Principal (destacado y centrado) -->
    <div class="top-centro">
      <a class="btn-menu-principal" href="/app/" title="Volver al panel principal de Qrystalos BA">
        <span class="material-icons btn-menu-ico">arrow_back</span>
        <span class="btn-menu-txt">Menú Principal</span>
      </a>
    </div>
    
    <!-- Derecha: Acciones del visor (en una sola línea) -->
    <div class="top-acciones" id="topAcciones">
      <!-- Conmutador de Modo de Lectura -->
      <div class="conmutador-modo" id="conmutadorModo" hidden>
        <button type="button" class="btn-modo activo" id="btnModoManual" title="Explicación paso a paso de cómo funciona el proceso en el negocio">
          <span class="ico">📖</span> Manual
        </button>
        <button type="button" class="btn-modo" id="btnModoValidaciones" title="Etapas detalladas, qué valida el sistema y qué revisar si da error">
          <span class="ico">📋</span> Validaciones
        </button>
      </div>

      <button type="button" class="btn btn-destacado" id="btnPresentar" hidden title="Presentar en pantalla completa para capacitaciones">
        <span class="ico">🖥️</span> Presentar
      </button>
      
      <button type="button" class="btn btn-secundario" id="btnActualizar" hidden title="Actualizar contenido de este proceso">
        <span class="ico">🔄</span> Actualizar
      </button>
    </div>
  </header>

  <div class="cuerpo" id="cuerpo">
    <aside class="indice" id="indice">
      <div class="indice-cabecera">
        <div class="indice-tit-fila">
          <span class="indice-titulo">
            <span class="material-icons" style="font-size: 0.95rem; color: #38bdf8;">layers</span>
            Módulos y Procesos
          </span>
          <div class="indice-tit-acciones">
            <button type="button" class="btn-toggle-todos" id="btnToggleTodos" title="Expandir o recoger todas las categorías">
              <span class="material-icons" id="icoToggleTodos">unfold_more</span>
            </button>
            <span class="indice-contador" id="indiceContador">26</span>
          </div>
        </div>
        <div class="buscador-box">
          <span class="material-icons buscador-ico">search</span>
          <input type="search" id="filtroProcesos" class="input-filtro" placeholder="Buscar módulo o proceso..." autocomplete="off">
        </div>
      </div>
      <div id="listaProcesos" class="lista-procesos"></div>
    </aside>

    <main class="escenario" id="escenario">
      <div class="cargando-box" id="cargando">
        <div class="spinner"></div>
        <p>Cargando guía de procesos…</p>
      </div>
    </main>
  </div>

  <footer class="pie-presentar" id="piePresentar" hidden>
    <div class="pie-presentar-izq">
      <span class="teclas-hint">Use las flechas <strong>â†</strong> <strong>â†’</strong> del teclado o <strong>ESC</strong> para salir</span>
    </div>
    <div class="pie-presentar-centro">
      <button type="button" class="btn btn-nav" id="btnPrev">â† Anterior</button>
      <div class="progreso-presentacion">
        <span id="pieProgreso">1 / 1</span>
        <div class="barra-progreso"><div class="barra-relleno" id="barraRelleno"></div></div>
      </div>
      <button type="button" class="btn btn-nav btn-primario" id="btnNext">Siguiente â†’</button>
    </div>
    <div class="pie-presentar-der">
      <button type="button" class="btn btn-salir" id="btnSalir">Salir de presentación (ESC)</button>
    </div>
  </footer>

  <script src="js/libro.js?v=47"></script>
</body>
</html>
