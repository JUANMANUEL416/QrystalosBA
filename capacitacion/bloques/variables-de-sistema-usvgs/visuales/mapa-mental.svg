<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .nodo-centro { fill: #3498DB; stroke: #2980B9; stroke-width: 3; }
      .texto-centro { fill: white; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .nodo-rama { stroke-width: 2; }
      .texto-rama { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .linea { stroke-width: 2; stroke-opacity: 0.7; }
    </style>
  </defs>
  <circle cx="400" cy="300" r="60" class="nodo-centro"/>
  <text x="400" y="295" class="texto-centro">Variables de</text>
  <text x="400" y="315" class="texto-centro">sistema (USVGS)</text>
  <line x1="400" y1="300" x2="400.0" y2="100.0" class="linea" stroke="#E74C3C"/>
  <circle cx="400.0" cy="100.0" r="50" class="nodo-rama" fill="#E74C3C"/>
  <text x="400.0" y="105.0" class="texto-rama">Objetivo</text>
  <line x1="400" y1="300" x2="600.0" y2="300.0" class="linea" stroke="#F39C12"/>
  <circle cx="600.0" cy="300.0" r="50" class="nodo-rama" fill="#F39C12"/>
  <text x="600.0" y="305.0" class="texto-rama">Contexto</text>
  <line x1="400" y1="300" x2="400.0" y2="500.0" class="linea" stroke="#27AE60"/>
  <circle cx="400.0" cy="500.0" r="50" class="nodo-rama" fill="#27AE60"/>
  <text x="400.0" y="505.0" class="texto-rama">Importante</text>
  <line x1="400" y1="300" x2="200.0" y2="300.0" class="linea" stroke="#9B59B6"/>
  <circle cx="200.0" cy="300.0" r="50" class="nodo-rama" fill="#9B59B6"/>
  <text x="200.0" y="305.0" class="texto-rama">Resumen</text>
</svg>